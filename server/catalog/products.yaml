# FX Sentinel — KB 상품 마스터 (외부화된 마스터)
# ═══════════════════════════════════════════════════════════════════════
#
# ■ 왜 이 파일이 있는가
# 상품 정보가 데모 HTML 의 JS 배열 안에 문자열로 박혀 있었다. 상품 담당자가 문안 한 줄을
# 고치려면 4,000행짜리 HTML 을 열어 따옴표 사이를 편집해야 했다. 그건 유지보수가 아니다.
#
# ■ 이 파일이 마스터다
# 서버는 이 파일을 읽고, `scripts/sync_demo_products.py --check` 가 데모 HTML 의
# KB_PRODUCTS 와 일치하는지 검사한다(테스트가 CI 로 강제). 갈라지면 죽는다.
# `--write` 로 데모 쪽 JS 블록을 이 파일에서 재생성할 수도 있다.
#
# ■ 요율·한도는 여기 없다 (의도)
# KB 상품/약관 DB·가격엔진이 미연동이므로 금리·수수료·한도를 적지 않는다.
# 지어낸 요율은 고객이 계약 조건으로 오해할 수 있다. 요율은 RM 견적으로 넘긴다.
#
# eligibility_key: server/app/elig.py 의 ELIG 키와 연결된다(빈 값 = 자격 게이트 없음).

version: "2026-07-19"
source_note: "KB 공식 상품·서비스 문안 기준. 요율·한도는 미포함(RM 견적 사항)."
rate_policy: "연동 전까지 요율·한도를 제공하지 않는다. 상품 후보 제시 + RM 견적 요청까지만."

categories:
  - 수입금융
  - 수출금융
  - 외환헤지
  - 외화상품
  - 무역지원

products:
  # ── 수입금융 ────────────────────────────────────────────────────
  - code: IMP-USANCE
    category: 수입금융
    name: KB Payment Usance
    source: KB 공식상품
    description: 수입 결제자금을 지원합니다(사전·사후 송금 방식).
    requirement: 수입기업 · USD/EUR/JPY/CNY 결제 · 만기 6개월 이내
    documents: 수입계약서·인보이스·운송서류
    channels: 영업점·기업뱅킹·전자무역(EDI)
    kb_path: 기업뱅킹 › 외환 › 수출입 › KB Payment Usance
    reference: https://obiz.kbstar.com/quics?page=C102065
    # 아래 제약은 recommendPackage 의 판정 근거와 같은 값이다(코드에도 동일 상수 존재).
    constraints:
      position: import
      currencies: [USD, EUR, JPY, CNY]
      max_horizon_bd: 126        # 기본 6개월 ≈ 126 영업일
    rm_checks: [포괄외화지급보증 한도, 금리, 인수수수료·전신료, 내부 신용심사]

